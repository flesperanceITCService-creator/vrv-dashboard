<title>Suivi de dossiers — Cartes dynamiques | ITC</title>
<style>
  :root{--blue:#1F4E78;--blue2:#2E75B6;--bg:#eef2f6;--ink:#1c2b3a;--mut:#5a6b7d;--ok:#2e7d32;--warn:#e67e22;--bad:#c62828}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
  header{background:var(--blue);color:#fff;padding:18px 22px}
  header h1{margin:0;font-size:21px}
  header p{margin:4px 0 0;opacity:.85;font-size:13px}
  header nav{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  header nav a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);padding:5px 12px;border-radius:20px;font-size:12.5px}
  header nav a.on{background:#fff;color:var(--blue);font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px 22px 4px}
  .kpi{background:#fff;border-radius:12px;padding:13px 15px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .kpi b{display:block;font-size:23px;color:var(--blue)}
  .kpi span{font-size:12px;color:var(--mut)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 22px}
  .bar input[type=search]{flex:1;min-width:210px;padding:9px 12px;border:1px solid #c4cfd9;border-radius:9px;font-size:14px}
  .bar select{padding:9px;border:1px solid #c4cfd9;border-radius:9px;font-size:13.5px;background:#fff}
  .bar label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
  .count{font-size:13px;color:var(--mut);padding:0 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(335px,1fr));gap:14px;padding:8px 22px 26px}
  .card{background:#fff;border-radius:13px;padding:15px 16px;box-shadow:0 1px 5px rgba(0,0,0,.09);cursor:pointer;border-top:4px solid var(--blue2);display:flex;flex-direction:column;gap:7px}
  .card:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.14)}
  .card.late{border-top-color:var(--bad)}
  .card .mc{font-size:12px;font-weight:700;color:var(--blue2);letter-spacing:.3px}
  .card h3{margin:0;font-size:15px;line-height:1.3}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .bdg{font-size:11px;padding:2.5px 9px;border-radius:12px;background:#e8eef4;color:var(--blue);font-weight:600}
  .bdg.actif{background:#e3f2e4;color:var(--ok)}
  .bdg.brouillon{background:#eceff1;color:#607080}
  .bdg.retard{background:#fbe4e4;color:var(--bad)}
  .bdg.lien{background:#e8e4f7;color:#5546a8}
  .meta{font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:2.5px}
  .fin{margin-top:2px}
  .fin .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
  .gauge{height:8px;background:#e6ebf0;border-radius:5px;overflow:hidden;margin-top:4px}
  .gauge i{display:block;height:100%;background:var(--ok)}
  .foot{font-size:12px;color:var(--mut);border-top:1px solid #edf0f3;padding-top:7px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  dialog{border:none;border-radius:14px;max-width:680px;width:94vw;padding:0;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  dialog .hd{background:var(--blue);color:#fff;padding:15px 20px;border-radius:14px 14px 0 0}
  dialog .bd{padding:16px 20px;font-size:13.5px}
  dialog table{width:100%;border-collapse:collapse;margin:6px 0 12px}
  dialog td{padding:4px 6px;border-bottom:1px solid #eef1f4;vertical-align:top}
  dialog td.k{color:var(--mut);width:170px}
  dialog ul{margin:4px 0;padding-left:18px}
  dialog li{margin:2px 0}
  .x{float:right;background:none;border:none;color:#fff;font-size:19px;cursor:pointer}
  .note{margin:0 22px 26px;background:#fff8e6;border:1px solid #f0dfae;border-radius:11px;padding:13px 16px;font-size:12.8px;color:#6d5a17}
  .empty{padding:38px;text-align:center;color:var(--mut)}
</style>
</head>

etats.forEach(e => $("fEtat").insertAdjacentHTML("beforeend", `<option>${e}</option>`));
resps.forEach(e => $("fResp").insertAdjacentHTML("beforeend", `<option>${e}</option>`));

$("note").innerHTML = `<b>Qualité des données (à savoir)</b> — Budget MEM : ${stats.budget_vide} dossiers sans budget, ${stats.budget_txt} en texte libre (plusieurs composantes ou note, ex. « pas de calculateur ») affichés tels quels sur la carte et exclus des totaux. Montant utilisé : ${stats.utilise_zero} dossiers à 0,00 $ et ${stats.utilise_vide} vides — la jauge ne devient parlante que si ce champ est tenu à jour dans ProgressionLIVE. Heures prévues : ${stats.heures_txt} en texte libre, exclues du total. Le lien avec une tâche de démarrage n'apparaît que si le numéro MC figure dans les deux exports (${kpi.taches_liees} tâches liées, export des tâches : ${kpi.src_t || "—"}).`;

function cardHTML(d){
  const p = pct(d);
  const gcol = p==null ? "" : (p>100 ? "var(--bad)" : p>=85 ? "var(--warn)" : "var(--ok)");
  const stale = d.ageProj!=null && d.ageProj>90;
  return `<article class="card ${stale?"late":""}" onclick="show('${d.code}')">
    <div class="mc">${d.mc || ""} · ${d.code}</div>
    <h3>${d.titre || "(sans titre)"}</h3>
    <div class="badges">
      <span class="bdg ${d.etat.startsWith("Dossier actif")?"actif":"brouillon"}">${d.etat}</span>
      ${d.taches.length?`<span class="bdg lien">🔗 ${d.taches.length} tâche(s) MEM</span>`:""}
      ${stale?`<span class="bdg retard">Suivi &gt; 90 j</span>`:""}
      ${p!=null && p>100?`<span class="bdg retard">Budget dépassé</span>`:""}
    </div>
    <div class="meta">
      <span>👤 ${d.resp || "—"} · 🏢 ${d.client}</span>
      ${d.rdv?`<span>📅 Rendez-vous : ${fmtD(d.rdv)}</span>`:""}
      ${d.po?`<span>🧾 PO ITC : ${d.po}</span>`:""}
    </div>
    <div class="fin">
      <div class="row"><span>Budget MEM : <b>${d.budget!=null?fmt$(d.budget):(d.budgetTxt?"texte libre":"—")}</b></span>
      <span>Utilisé : <b>${fmt$(d.utilise)}</b>${p!=null?` (${p.toFixed(1).replace(".",",")} %)`:""}</span></div>
      ${p!=null?`<div class="gauge"><i style="width:${Math.min(p,100)}%;background:${gcol}"></i></div>`:""}
      <div class="row" style="margin-top:4px"><span>Heures prévues : <b>${d.heures!=null?d.heures.toLocaleString("fr-CA")+" h":(d.heuresTxt?"texte libre":"—")}</b></span>
      <span>Équipements : <b>${d.equip.length}</b></span></div>
    </div>
    <div class="foot"><span>Dernier suivi : ${fmtD(d.majProj || d.maj)}</span><span>Cliquer pour le détail →</span></div>
  </article>`;
}

function render(){
  const q = $("q").value.toLowerCase(), fe = $("fEtat").value, fr = $("fResp").value, lie = $("fLie").checked, tri = $("fTri").value;
  let list = dossiers.filter(d =>
    (!fe || d.etat===fe) && (!fr || d.resp===fr) && (!lie || d.taches.length) &&
    (!q || [d.code,d.mc,d.titre,d.client,d.resp,d.po].join(" ").toLowerCase().includes(q)));
  const by = {
    maj: (a,b)=>(b.majProj||b.maj||"").localeCompare(a.majProj||a.maj||""),
    ancien: (a,b)=>(a.majProj||a.maj||"9999").localeCompare(b.majProj||b.maj||"9999"),
    budget: (a,b)=>(b.budget||-1)-(a.budget||-1),
    pct: (a,b)=>(pct(b)??-1)-(pct(a)??-1),
    rdv: (a,b)=>(a.rdv||"9999").localeCompare(b.rdv||"9999"),
  };
  list.sort(by[tri]);
  $("count").textContent = `${list.length} dossier(s) affiché(s) sur ${dossiers.length}`;
  $("grid").innerHTML = list.length ? list.map(cardHTML).join("") : `<div class="empty">Aucun dossier ne correspond aux filtres.</div>`;
}
["q","fEtat","fResp","fTri","fLie"].forEach(id => $(id).addEventListener("input", render));
render();

function show(code){
  const d = dossiers.find(x=>x.code===code); if(!d) return;
  const p = pct(d);
  $("dTitle").innerHTML = `<b>${d.mc || ""} — ${d.titre || ""}</b><br><span style="font-size:12.5px;opacity:.85">${d.code} · ${d.etat}</span>`;
  const taches = d.taches.length ? `<h4>Tâches de démarrage liées (export des tâches)</h4><ul>${
    d.taches.map(t=>`<li><b>${t.code}</b> — ${t.type} · ${t.etat}${t.rdv?` · rendez-vous ${fmtD(t.rdv)}`:""}</li>`).join("")}</ul>
    <p style="color:var(--mut)">Le détail de ces tâches se voit dans le kanban des démarrages.</p>` : `<p style="color:var(--mut)">Aucune tâche de démarrage liée dans l'export des tâches (le numéro MC n'y figure pas).</p>`;
  $("dBody").innerHTML = `<table>
    <tr><td class="k">Ressource humaine</td><td>${d.resp || "—"}</td></tr>
    <tr><td class="k">Client</td><td>${d.client}</td></tr>
    <tr><td class="k">Rendez-vous (dossier)</td><td>${fmtD(d.rdv)}</td></tr>
    <tr><td class="k">Budget MEM</td><td>${d.budget!=null?fmt$(d.budget):(d.budgetTxt?`⚠ texte libre : « ${d.budgetTxt} »`:"—")}</td></tr>
    <tr><td class="k">Montant utilisé à ce jour</td><td>${fmt$(d.utilise)}${p!=null?` — soit ${p.toFixed(1).replace(".",",")} % du budget`:""}</td></tr>
    <tr><td class="k">Heures prévues (MEM)</td><td>${d.heures!=null?d.heures.toLocaleString("fr-CA")+" h":(d.heuresTxt?`⚠ texte libre : « ${d.heuresTxt} »`:"—")}</td></tr>
    <tr><td class="k">PO ITC MTL/QC</td><td>${d.po || "—"}</td></tr>
    <tr><td class="k">Dernière mise à jour (suivi)</td><td>${fmtD(d.majProj)}${d.ageProj!=null?` (il y a ${d.ageProj} j, au ${fmtD(DATA.kpi.ref)})`:""}</td></tr>
    <tr><td class="k">Dernière MAJ (tâche)</td><td>${fmtD(d.maj)}</td></tr>
  </table>
  <h4>Équipements (${d.equip.length})</h4>
  ${d.equip.length?`<ul>${d.equip.map(e=>`<li>${e}</li>`).join("")}</ul>`:"<p>—</p>"}
  ${taches}`;
  dlg.showModal();
}
</script>
</body>
</html>
