<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#1F4E78;color:#1c2b3a;min-height:100vh}
  header{background:#16395c;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  header h1{margin:0;font-size:19px}
  header p{margin:4px 0 0;font-size:12px;opacity:.75}
  header button{background:#ffffff22;color:#fff;border:1px solid #ffffff44;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  header button:hover{background:#ffffff33}
  .board{display:flex;gap:14px;padding:20px 24px;align-items:flex-start;overflow-x:auto;min-height:70vh}
  .col{background:#eef1f5;border-radius:12px;min-width:290px;max-width:330px;flex:1;display:flex;flex-direction:column;max-height:calc(100vh - 170px)}
  .colhead{padding:12px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;border-top:4px solid #999;border-radius:12px 12px 0 0;background:#e2e8f0}
  .col[data-col="late"] .colhead{border-color:#d64545}
  .col[data-col="week"] .colhead{border-color:#e6a23c}
  .col[data-col="later"] .colhead{border-color:#3f9e4d}
  .col[data-col="done"] .colhead{border-color:#5B9BD5}
  .count{background:#1F4E78;color:#fff;border-radius:20px;padding:2px 10px;font-size:12px}
  .cards{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:120px}
  .card{background:#fff;border-radius:8px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:grab;border-left:4px solid #5B9BD5}
  .card[data-type*="PRE-MEM"]{border-left-color:#8e5bd6}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45}
  .card .code{font-weight:700;font-size:14px}
  .card .type{display:inline-block;font-size:11px;background:#e3ecf7;color:#1F4E78;border-radius:6px;padding:2px 8px;margin:6px 0}
  .card .meta{font-size:12px;color:#5a6b7d;margin-top:2px}
  .card .proj{font-size:11px;color:#8a97a5;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .col.dragover .cards{background:#dbe7f5;border-radius:8px}
  .foot{color:#ffffff88;font-size:11px;text-align:center;padding:0 0 20px}
</style>

né", "ville": "LAVAL", "projet": "MC63090230- AGRANDISSEMENT ECOLE RAYMOND SUD CSSDL"}, {"code": "MEMV011676", "type": "VRV - Assistance à la MEM", "rdv": "2025-02-03T08:00", "etat": "Terminé", "ville": "MONTRÉA", "projet": "MC63070188 - WHEEKER"}];
const TERMINE = ["Visite terminée","Facturé (ITC SERVICES)","Transmis au client","Terminé","Facturé sur autre tâche","Rapport complété","Prêt pour facturation","Confirmé non facturable","Consolidation projet","Annulation à moins de 48h d'avis"];
const COLS = [
  {id:"late",  title:"En retard"},
  {id:"week",  title:"Cette semaine"},
  {id:"later", title:"À venir"},
  {id:"done",  title:"Terminés"},
];
const today = new Date(); today.setHours(0,0,0,0);
const saved = JSON.parse(localStorage.getItem("vrv-kanban-cols") || "{}");
function autoCol(t){
  if (TERMINE.includes(t.etat)) return "done";
  if (!t.rdv) return "later";
  const d = new Date(t.rdv);
  if (d < today) return "late";
  if (d < new Date(today.getTime()+7*864e5)) return "week";
  return "later";
}
function colOf(t){ return saved[t.code] || autoCol(t); }
function fmtRdv(s){
  if(!s) return "sans date";
  const d = new Date(s);
  return d.toLocaleDateString("fr-CA",{weekday:"short",day:"numeric",month:"short"}) + " " +
         d.toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"});
}
function render(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  COLS.forEach(c => {
    const col = document.createElement("div");
    col.className = "col"; col.dataset.col = c.id;
    const cards = TASKS.filter(t => colOf(t) === c.id)
      .sort((a,b)=>(a.rdv||"9999").localeCompare(b.rdv||"9999"));
    col.innerHTML = `<div class="colhead"><span>${c.title}</span><span class="count">${cards.length}</span></div><div class="cards"></div>`;
    const zone = col.querySelector(".cards");
    cards.forEach(t => {
      const el = document.createElement("div");
      el.className = "card"; el.draggable = true; el.dataset.code = t.code; el.dataset.type = t.type;
      el.innerHTML = `<div class="code">${t.code}</div>
        <span class="type">${t.type.replace("VRV - ","")}</span>
        <div class="meta">📅 ${fmtRdv(t.rdv)} &bull; 📍 ${t.ville||"—"}</div>
        <div class="meta">${t.etat}</div>
        ${t.projet?`<div class="proj">${t.projet}</div>`:""}`;
      el.addEventListener("dragstart", ev => { ev.dataTransfer.setData("text/plain", t.code); el.classList.add("dragging"); });
      el.addEventListener("dragend", () => el.classList.remove("dragging"));
      zone.appendChild(el);
    });
    col.addEventListener("dragover", ev => { ev.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave", () => col.classList.remove("dragover"));
    col.addEventListener("drop", ev => {
      ev.preventDefault(); col.classList.remove("dragover");
      const code = ev.dataTransfer.getData("text/plain");
      saved[code] = c.id;
      localStorage.setItem("vrv-kanban-cols", JSON.stringify(saved));
      render();
    });
    board.appendChild(col);
  });
}
function resetBoard(){ localStorage.removeItem("vrv-kanban-cols"); for(const k in saved) delete saved[k]; render(); }
render();
